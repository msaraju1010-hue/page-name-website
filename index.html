<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER_SEC // ULTRA ENTERPRISE SMM SUITE</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/otpauth/9.1.4/otpauth.umd.min.js"></script>
  <style>
    :root {
      --bg-main: #010306;
      --bg-panel: rgba(6, 15, 26, 0.90);
      --border-neon: #00ff66;
      --border-glow: rgba(0, 255, 102, 0.35);
      --accent-neon: #00ff66;
      --accent-cyan: #00f0ff;
      --accent-red: #ff0055;
      --text-main: #f1f5f9;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Consolas', 'Courier New', monospace;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 20px;
      padding-bottom: 110px;
      max-width: 950px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Matrix Digital Rain Canvas Background */
    #matrixCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: -1;
      opacity: 0.28; /* প্রয়োজন অনুযায়ী বাড়ানো বা কমানো যাবে */
    }

    /* Top Mode Selector Tabs */
    .mode-nav {
      display: flex;
      gap: 14px;
      margin-bottom: 25px;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .tab-btn {
      flex: 1;
      max-width: 260px;
      padding: 14px 20px;
      background: var(--bg-panel);
      border: 1px solid var(--border-glow);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      backdrop-filter: blur(12px);
    }

    .tab-btn:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }

    .tab-btn.active {
      background: rgba(0, 255, 102, 0.12);
      border-color: var(--accent-neon);
      color: var(--accent-neon);
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.35), inset 0 0 12px rgba(0, 255, 102, 0.15);
      text-shadow: 0 0 10px rgba(0, 255, 102, 0.8);
    }

    /* Common Card Panel */
    .card-panel {
      background: var(--bg-panel);
      border: 1px solid var(--border-glow);
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 24px;
      backdrop-filter: blur(14px);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 255, 102, 0.03);
      position: relative;
      z-index: 2;
    }

    .card-header {
      font-size: 13px;
      font-weight: bold;
      color: var(--accent-neon);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0 0 8px rgba(0, 255, 102, 0.5);
    }

    /* 2FA Section */
    .tfa-input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .cyber-input {
      width: 100%;
      background: rgba(1, 3, 6, 0.95);
      border: 1px solid var(--border-glow);
      color: var(--accent-neon);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      letter-spacing: 1px;
      transition: all 0.3s;
    }

    .cyber-input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.4);
      color: var(--accent-cyan);
    }

    .btn-cyber {
      background: rgba(0, 255, 102, 0.1);
      border: 1px solid var(--border-glow);
      color: var(--accent-neon);
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-cyber:hover {
      background: var(--accent-neon);
      color: #010306;
      box-shadow: 0 0 22px rgba(0, 255, 102, 0.7);
    }

    .btn-action {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-neon), var(--accent-cyan));
      color: #010306;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
    }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 32px rgba(0, 255, 102, 0.7);
    }

    .otp-box {
      text-align: center;
      background: rgba(1, 3, 6, 0.85);
      border: 1px dashed var(--border-glow);
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 14px;
    }

    .otp-code {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 6px;
      color: #fff;
      text-shadow: 0 0 15px var(--accent-cyan), 0 0 30px var(--accent-neon);
    }

    /* Single Item Display (Name & Password Copy) */
    .single-display-box {
      text-align: center;
      background: rgba(1, 3, 6, 0.85);
      border: 1px solid var(--border-glow);
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 14px;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      color: var(--accent-cyan);
      word-break: break-all;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
    }

    .counter-text {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
      letter-spacing: 1px;
    }

    /* Name Grid (Page Mode) */
    .name-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }

    .name-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-glow);
      padding: 14px 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      word-break: break-word;
      position: relative;
      overflow: hidden;
    }

    .name-card:hover {
      border-color: var(--accent-cyan);
      transform: translateY(-3px);
      box-shadow: 0 5px 22px rgba(0, 240, 255, 0.3);
      color: var(--accent-cyan);
    }

    .name-card.state-1 { background: rgba(0, 255, 102, 0.15); color: var(--accent-neon); border-color: var(--accent-neon); box-shadow: inset 0 0 10px rgba(0, 255, 102, 0.25); }
    .name-card.state-2 { background: rgba(255, 170, 0, 0.15); color: #ffaa00; border-color: #ffaa00; box-shadow: inset 0 0 10px rgba(255, 170, 0, 0.25); }
    .name-card.state-3 { background: rgba(255, 0, 85, 0.15); color: var(--accent-red); border-color: var(--accent-red); text-decoration: line-through; opacity: 0.6; }

    /* Floating Input Section */
    .floating-fab {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: var(--accent-neon);
      color: #010306;
      border: none;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 0 28px rgba(0, 255, 102, 0.7);
      z-index: 100;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .floating-fab:hover {
      transform: scale(1.1) rotate(90deg);
      background: var(--accent-cyan);
      box-shadow: 0 0 38px rgba(0, 240, 255, 0.9);
    }

    .input-modal {
      position: fixed;
      bottom: 95px;
      right: 25px;
      width: 340px;
      background: var(--bg-panel);
      border: 1px solid var(--border-glow);
      border-radius: 14px;
      padding: 20px;
      display: none;
      z-index: 101;
      box-shadow: 0 15px 45px rgba(0,0,0,0.95);
      backdrop-filter: blur(18px);
      animation: modalFade 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalFade {
      from { opacity: 0; transform: translateY(15px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .input-modal.active { display: block; }

    textarea {
      width: 100%;
      height: 110px;
      background: rgba(1, 3, 6, 0.95);
      border: 1px solid var(--border-glow);
      color: var(--accent-neon);
      padding: 10px;
      border-radius: 8px;
      outline: none;
      font-size: 13px;
      margin-bottom: 12px;
      resize: vertical;
    }

    textarea:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
    }

    select {
      width: 100%;
      padding: 10px;
      background: rgba(1, 3, 6, 0.95);
      border: 1px solid var(--border-glow);
      color: var(--accent-cyan);
      border-radius: 8px;
      margin-bottom: 12px;
      outline: none;
      font-weight: bold;
    }

    /* Sound Switch Container */
    .sound-toggle-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(1, 3, 6, 0.85);
      border: 1px solid var(--border-glow);
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--accent-neon);
    }

    .sound-toggle-box select {
      width: auto;
      margin-bottom: 0;
      padding: 4px 8px;
      font-size: 11px;
    }

    #toast {
      visibility: hidden;
      min-width: 240px;
      background: rgba(6, 15, 26, 0.95);
      color: var(--accent-neon);
      text-align: center;
      border-radius: 30px;
      padding: 12px 20px;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      border: 1px solid var(--accent-neon);
      box-shadow: 0 0 28px rgba(0, 255, 102, 0.5);
      z-index: 1000;
      backdrop-filter: blur(12px);
    }

    #toast.show {
      visibility: visible;
      animation: fadeIn 0.3s, fadeOut 0.3s 1.5s;
    }

    @keyframes fadeIn { from { bottom: 10px; opacity: 0; } to { bottom: 30px; opacity: 1; } }
    @keyframes fadeOut { from { bottom: 30px; opacity: 1; } to { bottom: 10px; opacity: 0; } }

    @media (max-width: 480px) {
      body { padding: 12px; }
      .input-modal { width: calc(100% - 24px); right: 12px; bottom: 85px; }
      .otp-code { font-size: 26px; letter-spacing: 4px; }
      .single-display-box { font-size: 17px; padding: 15px; }
    }
  </style>
</head>
<body>

  <!-- Background Matrix Rain Canvas -->
  <canvas id="matrixCanvas"></canvas>

  <!-- Mode Selector -->
  <div class="mode-nav">
    <button class="tab-btn active" id="btnPageMode" onclick="switchMode('page')"><i class="fa-solid fa-flag"></i> Page Mode</button>
    <button class="tab-btn" id="btnIdMode" onclick="switchMode('id')"><i class="fa-solid fa-user-secret"></i> ID Mode</button>
  </div>

  <!-- Shared 2FA Authorization Section -->
  <div class="card-panel">
    <div class="card-header"><i class="fa-solid fa-shield-halved"></i> 2FA Security Core</div>
    <div class="tfa-input-group">
      <input type="text" id="tfaKeyInput" class="cyber-input" placeholder="Paste 2FA Secret Key..." oninput="updateOTP()">
      <button class="btn-cyber" onclick="reset2FA()"><i class="fa-solid fa-rotate"></i> Reset</button>
    </div>
    
    <div class="otp-box">
      <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 1px;">LIVE OTP TOKEN (EXPIRES IN <span id="otpTimer" style="color: var(--accent-cyan);">30s</span>)</div>
      <div class="otp-code" id="otpCode">------</div>
    </div>

    <button class="btn-action" onclick="copyOTP()"><i class="fa-regular fa-copy"></i> COPY 2FA VERIFICATION CODE</button>
    <button class="btn-cyber" style="width: 100%; margin-top: 8px; justify-content: center;" onclick="copySecretKey()"><i class="fa-solid fa-key"></i> Copy Secret Master Key</button>
  </div>

  <!-- PAGE MODE VIEW -->
  <div id="pageModeContainer">
    <div class="card-panel">
      <div class="card-header"><i class="fa-solid fa-list-check"></i> Facebook Page Names Pool</div>
      <div class="name-grid" id="pageNameContainer"></div>
    </div>
  </div>

  <!-- ID MODE VIEW -->
  <div id="idModeContainer" style="display: none;">
    <!-- ID Name Copy Panel -->
    <div class="card-panel">
      <div class="card-header"><i class="fa-solid fa-id-badge"></i> ID Name Sequencer</div>
      <div class="single-display-box" id="idNameDisplay">No Names Uploaded</div>
      <button class="btn-action" onclick="copyIdName()"><i class="fa-regular fa-copy"></i> COPY NEXT ID NAME</button>
      <div class="counter-text" id="idNameCounter">0 / 0 (AUTO-RECYCLE LOOP ACTIVE)</div>
    </div>

    <!-- ID Password Copy Panel -->
    <div class="card-panel">
      <div class="card-header"><i class="fa-solid fa-key"></i> Password Vault Sequencer</div>
      <div class="single-display-box" id="passwordDisplay">No Passwords Uploaded</div>
      <button class="btn-action" onclick="copyPassword()"><i class="fa-regular fa-copy"></i> COPY NEXT PASSWORD</button>
      <div class="counter-text" id="passwordCounter">0 / 0 (AUTO-RECYCLE LOOP ACTIVE)</div>
    </div>
  </div>

  <!-- Floating Add & Manage Modal -->
  <button class="floating-fab" onclick="toggleModal()"><i class="fa-solid fa-plus"></i></button>
  
  <div class="input-modal" id="inputModal">
    <div class="card-header" style="font-size: 11px; margin-bottom: 10px;"><i class="fa-solid fa-database"></i> Batch Data Injector</div>
    
    <!-- Sound Tune Selector Option -->
    <div class="sound-toggle-box">
      <span><i class="fa-solid fa-volume-high"></i> Hacker Sound Tune:</span>
      <select id="soundPresetSelect" onchange="changeSoundPreset(this.value)">
        <option value="cyber">Cyber Click (Mouse)</option>
        <option value="mech">Mechanical Typing</option>
        <option value="glitch">Sci-Fi Glitch</option>
        <option value="off">MUTE (Off)</option>
      </select>
    </div>

    <select id="importType">
      <option value="page">Page Names (Page Mode)</option>
      <option value="idName">ID Names (ID Mode)</option>
      <option value="password">Passwords (ID Mode)</option>
    </select>
    <textarea id="importText" placeholder="Paste items here (newline separated)..."></textarea>
    <div style="display: flex; gap: 8px;">
      <button class="btn-cyber" style="flex: 1; justify-content: center;" onclick="processImport()">Inject</button>
      <button class="btn-cyber" style="color: var(--accent-red); border-color: var(--accent-red); justify-content: center;" onclick="clearCurrentCategory()">Wipe</button>
    </div>
  </div>

  <div id="toast">ACTION SUCCESSFUL</div>

  <script>
    /* --- Matrix Terminal Digital Rain Animation (Japanese Katakana & Numbers) --- */
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Japanese Katakana & Math/Alpha characters
    const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ$%#@!><*';
    const characters = katakana.split('');

    const fontSize = 14;
    let columns = Math.floor(canvas.width / fontSize);
    let drops = [];

    function initDrops() {
      columns = Math.floor(canvas.width / fontSize);
      drops = [];
      for (let i = 0; i < columns; i++) {
        drops[i] = Math.floor(Math.random() * -100); // Random starting position
      }
    }
    initDrops();

    function drawMatrix() {
      // Semi-transparent black background for trail effect
      ctx.fillStyle = 'rgba(1, 3, 6, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#00ff66';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = characters[Math.floor(Math.random() * characters.length)];
        const x = i * fontSize;
        const y = drops[i] * fontSize;

        ctx.fillText(text, x, y);

        if (y > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 35);


    /* --- Multi-Tune Web Audio Synthesizer Engine --- */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let currentSoundPreset = localStorage.getItem('smm_sound_preset') || 'cyber';

    function playHackerSound() {
      if (currentSoundPreset === 'off') return;

      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if (currentSoundPreset === 'cyber') {
        const bufferSize = audioCtx.sampleRate * 0.02;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 3500;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.018);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();

      } else if (currentSoundPreset === 'mech') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.04);

        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.04);

      } else if (currentSoundPreset === 'glitch') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(1600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(3200, audioCtx.currentTime + 0.03);

        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.03);
      }
    }

    function changeSoundPreset(val) {
      currentSoundPreset = val;
      localStorage.setItem('smm_sound_preset', val);
      playHackerSound();
    }

    // App Data Storage
    let pageNames = JSON.parse(localStorage.getItem('smm_page_names')) || [];
    let idNames = JSON.parse(localStorage.getItem('smm_id_names')) || [];
    let passwords = JSON.parse(localStorage.getItem('smm_passwords')) || [];

    let idNameIndex = parseInt(localStorage.getItem('smm_id_index')) || 0;
    let passwordIndex = parseInt(localStorage.getItem('smm_pass_index')) || 0;

    window.onload = function() {
      document.getElementById('soundPresetSelect').value = currentSoundPreset;
      renderPageNames();
      updateIdNameUI();
      updatePasswordUI();
      setInterval(updateOTP, 1000);
    };

    function switchMode(mode) {
      playHackerSound();
      document.getElementById('btnPageMode').classList.toggle('active', mode === 'page');
      document.getElementById('btnIdMode').classList.toggle('active', mode === 'id');
      
      document.getElementById('pageModeContainer').style.display = mode === 'page' ? 'block' : 'none';
      document.getElementById('idModeContainer').style.display = mode === 'id' ? 'block' : 'none';
    }

    function toggleModal() {
      playHackerSound();
      document.getElementById('inputModal').classList.toggle('active');
    }

    /* 2FA Authenticator Engine */
    function updateOTP() {
      const secret = document.getElementById('tfaKeyInput').value.replace(/\s+/g, '').toUpperCase();
      const otpDisplay = document.getElementById('otpCode');
      const timerDisplay = document.getElementById('otpTimer');

      const epoch = Math.floor(Date.now() / 1000);
      const secondsLeft = 30 - (epoch % 30);
      timerDisplay.innerText = secondsLeft + 's';

      if (!secret) {
        otpDisplay.innerText = "------";
        return;
      }

      try {
        const totp = new OTPAuth.TOTP({ secret: OTPAuth.Secret.fromBase32(secret) });
        otpDisplay.innerText = totp.generate();
      } catch (e) {
        otpDisplay.innerText = "ERROR";
      }
    }

    function reset2FA() {
      playHackerSound();
      document.getElementById('tfaKeyInput').value = '';
      updateOTP();
      showToast('2FA KEY PURGED');
    }

    function copySecretKey() {
      const key = document.getElementById('tfaKeyInput').value.trim();
      if (!key) return showToast('ERROR: NO KEY FOUND');
      playHackerSound();
      navigator.clipboard.writeText(key).then(() => showToast('MASTER KEY COPIED'));
    }

    function copyOTP() {
      const code = document.getElementById('otpCode').innerText;
      if (code === "------" || code === "ERROR") return showToast('ERROR: INVALID CODE');
      playHackerSound();
      navigator.clipboard.writeText(code).then(() => showToast(`OTP COPIED: ${code}`));
    }

    /* Page Names Grid */
    function renderPageNames() {
      const container = document.getElementById('pageNameContainer');
      container.innerHTML = '';
      
      if(pageNames.length === 0) {
        container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 20px;">NO PAGE NAMES INJECTED YET</p>`;
        return;
      }

      pageNames.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = `name-card ${item.state ? 'state-' + item.state : ''}`;
        card.innerText = item.name;
        card.onclick = function() {
          playHackerSound();
          item.state = ((item.state || 0) + 1) % 4;
          localStorage.setItem('smm_page_names', JSON.stringify(pageNames));
          renderPageNames();
          navigator.clipboard.writeText(item.name).then(() => showToast(`COPIED: "${item.name}"`));
        };
        container.appendChild(card);
      });
    }

    /* ID Name Recycling System */
    function updateIdNameUI() {
      const display = document.getElementById('idNameDisplay');
      const counter = document.getElementById('idNameCounter');
      if (idNames.length === 0) {
        display.innerText = "No Names Uploaded";
        counter.innerText = "0 / 0";
        return;
      }
      if (idNameIndex >= idNames.length) idNameIndex = 0;
      display.innerText = idNames[idNameIndex];
      counter.innerText = `${idNameIndex + 1} / ${idNames.length} (AUTO-RECYCLE LOOP ACTIVE)`;
    }

    function copyIdName() {
      if (idNames.length === 0) return showToast('ERROR: NO ID NAMES');
      playHackerSound();
      const currentName = idNames[idNameIndex];
      navigator.clipboard.writeText(currentName).then(() => {
        showToast(`COPIED ID: "${currentName}"`);
        idNameIndex = (idNameIndex + 1) % idNames.length;
        localStorage.setItem('smm_id_index', idNameIndex);
        updateIdNameUI();
      });
    }

    /* Password Recycling System */
    function updatePasswordUI() {
      const display = document.getElementById('passwordDisplay');
      const counter = document.getElementById('passwordCounter');
      if (passwords.length === 0) {
        display.innerText = "No Passwords Uploaded";
        counter.innerText = "0 / 0";
        return;
      }
      if (passwordIndex >= passwords.length) passwordIndex = 0;
      display.innerText = passwords[passwordIndex];
      counter.innerText = `${passwordIndex + 1} / ${passwords.length} (AUTO-RECYCLE LOOP ACTIVE)`;
    }

    function copyPassword() {
      if (passwords.length === 0) return showToast('ERROR: NO PASSWORDS');
      playHackerSound();
      const currentPass = passwords[passwordIndex];
      navigator.clipboard.writeText(currentPass).then(() => {
        showToast(`PASSWORD COPIED`);
        passwordIndex = (passwordIndex + 1) % passwords.length;
        localStorage.setItem('smm_pass_index', passwordIndex);
        updatePasswordUI();
      });
    }

    /* Batch Import Process */
    function processImport() {
      playHackerSound();
      const type = document.getElementById('importType').value;
      const text = document.getElementById('importText').value.trim();
      if (!text) return;

      const lines = text.split('\n').map(l => l.trim()).filter(l => l !== '');

      if (type === 'page') {
        lines.forEach(l => pageNames.push({ name: l, state: 0 }));
        localStorage.setItem('smm_page_names', JSON.stringify(pageNames));
        renderPageNames();
      } else if (type === 'idName') {
        idNames = idNames.concat(lines);
        localStorage.setItem('smm_id_names', JSON.stringify(idNames));
        updateIdNameUI();
      } else if (type === 'password') {
        passwords = passwords.concat(lines);
        localStorage.setItem('smm_passwords', JSON.stringify(passwords));
        updatePasswordUI();
      }

      document.getElementById('importText').value = '';
      toggleModal();
      showToast('DATA INJECTED SUCCESSFULLY');
    }

    function clearCurrentCategory() {
      playHackerSound();
      const type = document.getElementById('importType').value;
      if (confirm('WARNING: Wipe this dataset?')) {
        if (type === 'page') { pageNames = []; localStorage.removeItem('smm_page_names'); renderPageNames(); }
        if (type === 'idName') { idNames = []; idNameIndex = 0; localStorage.removeItem('smm_id_names'); updateIdNameUI(); }
        if (type === 'password') { passwords = []; passwordIndex = 0; localStorage.removeItem('smm_passwords'); updatePasswordUI(); }
        toggleModal();
        showToast('DATASET WIPED');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.className = 'show';
      setTimeout(() => { toast.className = toast.className.replace('show', ''); }, 1500);
    }
  </script>
</body>
</html>
